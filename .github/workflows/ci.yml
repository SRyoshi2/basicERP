name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      USE_SQLITE: "true"
      DJANGO_SECRET_KEY: ci-only-secret
      POSTGRES_PASSWORD: composecheck
      DATABASE_URL: postgresql://basicerp:composecheck@db:5432/basicerp
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt
      - name: Check and test backend
        working-directory: backend
        run: |
          ruff check .
          python manage.py makemigrations --check --dry-run
          python manage.py spectacular --validate --file /tmp/openapi.yaml
          pytest
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Check and build frontend
        working-directory: frontend
        run: npm run lint && npm run build
      - name: Validate and build containers
        run: |
          docker compose --env-file .env.example config --quiet
          docker compose --env-file .env.example build
