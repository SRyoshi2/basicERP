name: ${COMPOSE_PROJECT_NAME:-basicerp}

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-basicerp}
      POSTGRES_USER: ${POSTGRES_USER:-basicerp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD muss in .env gesetzt sein}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-basicerp} -d ${POSTGRES_DB:-basicerp}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  web:
    build:
      context: ./backend
    restart: unless-stopped
    environment: &backend_environment
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY muss in .env gesetzt sein}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-false}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost:8080}
      APP_PUBLIC_SCHEME: ${APP_PUBLIC_SCHEME:-http}
      APP_TIME_ZONE: ${APP_TIME_ZONE:-Europe/Berlin}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL muss in .env gesetzt sein}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - media_data:/app/media
      - archive_data:/app/archive
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready/', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  worker:
    build:
      context: ./backend
    restart: unless-stopped
    command: ["celery", "-A", "config", "worker", "--loglevel=INFO", "--concurrency=2"]
    environment: *backend_environment
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      web:
        condition: service_healthy
    volumes:
      - media_data:/app/media
      - archive_data:/app/archive

  nginx:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "${APP_HTTP_PORT:-8080}:80"
    volumes:
      - media_data:/srv/media:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 3s
      retries: 12

volumes:
  postgres_data:
  redis_data:
  media_data:
  archive_data:
