components:
  schemas:
    ActionEnum:
      enum:
      - created
      - updated
      - archived
      type: string
      description: |-
        * `created` - Erstellt
        * `updated` - Geändert
        * `archived` - Archiviert
    Address:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        kind:
          $ref: '#/components/schemas/AddressKindEnum'
        label:
          type: string
          maxLength: 100
        street:
          type: string
          maxLength: 200
        postal_code:
          type: string
          maxLength: 20
        city:
          type: string
          maxLength: 120
        country_code:
          type: string
          default: DE
          pattern: ^[A-Za-z]{2}$
        is_default:
          type: boolean
      required:
      - city
      - id
      - postal_code
      - street
    AddressKindEnum:
      enum:
      - billing
      - shipping
      - other
      type: string
      description: |-
        * `billing` - Rechnung
        * `shipping` - Lieferung
        * `other` - Sonstige
    ApiError:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        fields: {}
      required:
      - code
      - message
    ApiErrorResponse:
      type: object
      properties:
        error:
          $ref: '#/components/schemas/ApiError'
      required:
      - error
    AssigneeOption:
      type: object
      properties:
        id:
          type: string
        username:
          type: string
        display_name:
          type: string
          readOnly: true
      required:
      - display_name
      - id
      - username
    CatalogAuditEvent:
      type: object
