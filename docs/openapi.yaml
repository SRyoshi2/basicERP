openapi: 3.0.3
info:
  title: basicERP API
  version: 0.1.0
  description: API-first ERP für kleine Unternehmen
paths:
  /api/v1/auth/change-password/:
    post:
      operationId: auth_change_password_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePassword'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ChangePassword'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ChangePassword'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
          description: ''
  /api/v1/auth/csrf/:
    get:
      operationId: auth_csrf_retrieve
      tags:
      - auth
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsrfToken'
          description: ''
  /api/v1/auth/login/:
    post:
      operationId: auth_login_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Login'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Login'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
          description: ''
  /api/v1/auth/logout/:
    post:
      operationId: auth_logout_create
      tags:
      - auth
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/auth/me/:
    get:
      operationId: auth_me_retrieve
      tags:
      - auth
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/v1/catalog/items/:
    get:
      operationId: catalog_items_list
      parameters:
      - in: query
        name: archived
        schema:
          type: string
          enum:
          - all
          - 'false'
          - 'true'
      - in: query
        name: kind
        schema:
          type: string
          enum:
          - product
          - service
      - name: page
        required: false
        in: query
        description: Eine Seitenzahl in der paginierten Ergebnismenge.
        schema:
          type: integer
      - in: query
        name: search
        schema:
          type: string
        description: Name, Beschreibung oder Nummer
      - in: query
        name: unit
        schema:
          type: string
          enum:
          - day
          - flat
          - hour
          - piece
      tags:
      - catalog
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCatalogItemList'
          description: ''
    post:
      operationId: catalog_items_create
      tags:
      - catalog
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CatalogItemCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CatalogItemCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CatalogItemCreate'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogItem'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
          description: ''
  /api/v1/catalog/items/{id}/:
    get:
      operationId: catalog_items_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: Ein UUID-String, der catalog item identifiziert.
        required: true
      tags:
      - catalog
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogItem'
          description: ''
    patch:
      operationId: catalog_items_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: Ein UUID-String, der catalog item identifiziert.
        required: true
      tags:
      - catalog
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedCatalogItemUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedCatalogItemUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedCatalogItemUpdate'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogItem'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
          description: ''
  /api/v1/catalog/items/{id}/archive/:
    post:
      operationId: catalog_items_archive_create
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: Ein UUID-String, der catalog item identifiziert.
        required: true
      tags:
      - catalog
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogItem'
          description: ''
  /api/v1/catalog/items/{id}/history/:
    get:
      operationId: catalog_items_history_list
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: Ein UUID-String, der catalog item identifiziert.
        required: true
      tags:
      - catalog
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CatalogAuditEvent'
          description: ''
  /api/v1/company/:
    get:
      operationId: company_retrieve
      tags:
      - company
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyProfile'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
          description: ''
    patch:
      operationId: company_partial_update
      tags:
      - company
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedCompanyProfile'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedCompanyProfile'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedCompanyProfile'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyProfile'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
          description: ''
  /api/v1/crm/contacts/:
    get:
      operationId: crm_contacts_list
      parameters:
      - in: query
        name: archived
        schema:
          type: string
          enum:
          - all
          - 'false'
          - 'true'
        description: Aktive, archivierte oder alle Kontakte
      - in: query
        name: kind
        schema:
          type: string
          enum:
          - organization
          - person
        description: Firma oder Person
      - name: page
        required: false
        in: query
        description: Eine Seitenzahl in der paginierten Ergebnismenge.
        schema:
          type: integer
      - in: query
        name: search
        schema:
          type: string
        description: Name, E-Mail oder Kundennummer
      tags:
      - crm
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedContactList'
          description: ''
    post:
      operationId: crm_contacts_create
      tags:
      - crm
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ContactCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ContactCreate'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contact'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
          description: ''
  /api/v1/crm/contacts/{id}/:
    get:
      operationId: crm_contacts_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: Ein UUID-String, der contact identifiziert.
        required: true
      tags:
      - crm
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contact'
          description: ''
    patch:
      operationId: crm_contacts_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: Ein UUID-String, der contact identifiziert.
        required: true
      tags:
      - crm
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedContactUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedContactUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedContactUpdate'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contact'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
          description: ''
  /api/v1/crm/contacts/{id}/archive/:
    post:
      operationId: crm_contacts_archive_create
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: Ein UUID-String, der contact identifiziert.
        required: true
      tags:
      - crm
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contact'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
          description: ''
  /api/v1/crm/contacts/{id}/history/:
    get:
      operationId: crm_contacts_history_list
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: Ein UUID-String, der contact identifiziert.
        required: true
      tags:
      - crm
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ContactAuditEvent'
          description: ''
  /api/v1/health/live/:
    get:
      operationId: health_live_retrieve
      tags:
      - health
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          description: ''
  /api/v1/health/ready/:
    get:
      operationId: health_ready_retrieve
      tags:
      - health
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          description: ''
components:
  schemas:
    ActionEnum:
      enum:
      - created
      - updated
      - archived
      type: string
      description: |-
        * `created` - Erstellt
        * `updated` - Geändert
        * `archived` - Archiviert
    Address:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        kind:
          $ref: '#/components/schemas/AddressKindEnum'
        label:
          type: string
          maxLength: 100
        street:
          type: string
          maxLength: 200
        postal_code:
          type: string
          maxLength: 20
        city:
          type: string
          maxLength: 120
        country_code:
          type: string
          default: DE
          pattern: ^[A-Za-z]{2}$
        is_default:
          type: boolean
      required:
      - city
      - id
      - postal_code
      - street
    AddressKindEnum:
      enum:
      - billing
      - shipping
      - other
      type: string
      description: |-
        * `billing` - Rechnung
        * `shipping` - Lieferung
        * `other` - Sonstige
    ApiError:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        fields: {}
      required:
      - code
      - message
    ApiErrorResponse:
      type: object
      properties:
        error:
          $ref: '#/components/schemas/ApiError'
      required:
      - error
    CatalogAuditEvent:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        action:
          $ref: '#/components/schemas/ActionEnum'
        version:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        changes: {}
        actor:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - action
      - actor
      - created_at
      - id
      - version
    CatalogItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        item_number:
          type: string
          readOnly: true
        kind:
          $ref: '#/components/schemas/CatalogItemKindEnum'
        name:
          type: string
          maxLength: 200
        description:
          type: string
        unit:
          $ref: '#/components/schemas/CatalogUnitEnum'
        tax_rate:
          $ref: '#/components/schemas/CatalogTaxRateEnum'
        tax_note:
          type: string
          maxLength: 240
        current_price:
          allOf:
          - $ref: '#/components/schemas/CatalogPrice'
          nullable: true
          readOnly: true
        prices:
          type: array
          items:
            $ref: '#/components/schemas/CatalogPrice'
          readOnly: true
        version:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        archived_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - current_price
      - id
      - item_number
      - kind
      - name
      - prices
      - tax_rate
      - unit
      - updated_at
    CatalogItemCreate:
      type: object
      properties:
        kind:
          $ref: '#/components/schemas/CatalogItemKindEnum'
        name:
          type: string
          maxLength: 200
        description:
          type: string
        unit:
          $ref: '#/components/schemas/CatalogUnitEnum'
        tax_rate:
          $ref: '#/components/schemas/CatalogTaxRateEnum'
        tax_note:
          type: string
          maxLength: 240
        prices:
          type: array
          items:
            $ref: '#/components/schemas/CatalogPrice'
      required:
      - kind
      - name
      - prices
      - tax_rate
      - unit
    CatalogItemKindEnum:
      enum:
      - product
      - service
      type: string
      description: |-
        * `product` - Artikel
        * `service` - Leistung
    CatalogPrice:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        net_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        valid_from:
          type: string
          format: date
        valid_until:
          type: string
          format: date
          nullable: true
      required:
      - id
      - net_amount
      - valid_from
    CatalogTaxRateEnum:
      enum:
      - '19.00'
      - '7.00'
      - '0.00'
      type: string
      description: |-
        * `19.00` - 19 %
        * `7.00` - 7 %
        * `0.00` - 0 %
    CatalogUnitEnum:
      enum:
      - hour
      - day
      - piece
      - flat
      type: string
      description: |-
        * `hour` - Stunde
        * `day` - Tag
        * `piece` - Stück
        * `flat` - Pauschal
    ChangePassword:
      type: object
      properties:
        current_password:
          type: string
          writeOnly: true
        new_password:
          type: string
          writeOnly: true
      required:
      - current_password
      - new_password
    CompanyProfile:
      type: object
      properties:
        name:
          type: string
          maxLength: 200
        legal_name:
          type: string
          maxLength: 200
        street:
          type: string
          maxLength: 200
        postal_code:
          type: string
          maxLength: 20
        city:
          type: string
          maxLength: 120
        country_code:
          type: string
          pattern: ^[A-Za-z]{2}$
        vat_id:
          type: string
          maxLength: 32
        tax_number:
          type: string
          maxLength: 64
        email:
          type: string
          format: email
          maxLength: 254
        phone:
          type: string
          maxLength: 50
        website:
          type: string
          format: uri
          maxLength: 200
        logo:
          type: string
          format: uri
          writeOnly: true
          pattern: (?:png|jpg|jpeg|webp)$
        logo_url:
          type: string
          nullable: true
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - country_code
      - logo_url
      - updated_at
    Contact:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        customer_number:
          type: string
          readOnly: true
        kind:
          $ref: '#/components/schemas/ContactKindEnum'
        display_name:
          type: string
          readOnly: true
        company_name:
          type: string
          maxLength: 200
        salutation:
          type: string
          maxLength: 30
        title:
          type: string
          maxLength: 50
        first_name:
          type: string
          maxLength: 120
        last_name:
          type: string
          maxLength: 120
        email:
          type: string
          format: email
          maxLength: 254
        phone:
          type: string
          maxLength: 50
        website:
          type: string
          format: uri
          maxLength: 200
        vat_id:
          type: string
          maxLength: 32
        leitweg_id:
          type: string
          maxLength: 64
        version:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        archived_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        addresses:
          type: array
          items:
            $ref: '#/components/schemas/Address'
          readOnly: true
        contact_persons:
          type: array
          items:
            $ref: '#/components/schemas/ContactPerson'
          readOnly: true
      required:
      - addresses
      - contact_persons
      - created_at
      - customer_number
      - display_name
      - id
      - kind
      - updated_at
    ContactAuditEvent:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        action:
          $ref: '#/components/schemas/ActionEnum'
        version:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        changes: {}
        actor:
          type: string
          nullable: true
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - action
      - actor
      - created_at
      - id
      - version
    ContactCreate:
      type: object
      properties:
        kind:
          $ref: '#/components/schemas/ContactKindEnum'
        company_name:
          type: string
          maxLength: 200
        salutation:
          type: string
          maxLength: 30
        title:
          type: string
          maxLength: 50
        first_name:
          type: string
          maxLength: 120
        last_name:
          type: string
          maxLength: 120
        email:
          type: string
          format: email
          maxLength: 254
        phone:
          type: string
          maxLength: 50
        website:
          type: string
          format: uri
          maxLength: 200
        vat_id:
          type: string
          maxLength: 32
        leitweg_id:
          type: string
          maxLength: 64
        addresses:
          type: array
          items:
            $ref: '#/components/schemas/Address'
        contact_persons:
          type: array
          items:
            $ref: '#/components/schemas/ContactPerson'
      required:
      - kind
    ContactKindEnum:
      enum:
      - organization
      - person
      type: string
      description: |-
        * `organization` - Firma
        * `person` - Person
    ContactPerson:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        salutation:
          type: string
          maxLength: 30
        title:
          type: string
          maxLength: 50
        first_name:
          type: string
          maxLength: 120
        last_name:
          type: string
          maxLength: 120
        role:
          type: string
          maxLength: 120
        email:
          type: string
          format: email
          maxLength: 254
        phone:
          type: string
          maxLength: 50
        is_primary:
          type: boolean
      required:
      - first_name
      - id
      - last_name
    CsrfToken:
      type: object
      properties:
        csrfToken:
          type: string
      required:
      - csrfToken
    Health:
      type: object
      properties:
        status:
          type: string
      required:
      - status
    Login:
      type: object
      properties:
        identifier:
          type: string
          maxLength: 254
