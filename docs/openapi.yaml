components:
  schemas:
    AbsenceActionEnum:
      enum:
      - created
      - updated
      - approved
      - rejected
      - cancelled
      type: string
      description: |-
        * `created` - Erstellt
        * `updated` - Geändert
        * `approved` - Genehmigt
        * `rejected` - Abgelehnt
        * `cancelled` - Storniert
    AbsenceCreate:
      type: object
      properties:
        kind:
          $ref: '#/components/schemas/AbsenceKindEnum'
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        note:
          type: string
      required:
      - end_date
      - kind
      - start_date
    AbsenceKindEnum:
      enum:
      - vacation
      - sickness
      - other
      type: string
      description: |-
        * `vacation` - Urlaub
        * `sickness` - Krankheit
        * `other` - Sonstiges
    AbsenceRequest:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        employee:
          type: integer
          readOnly: true
        employee_name:
          type: string
          readOnly: true
        kind:
          $ref: '#/components/schemas/AbsenceKindEnum'
        kind_label:
          type: string
          readOnly: true
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        working_days:
          type: string
          format: decimal
          pattern: ^-?\d{0,4}(?:\.\d{0,2})?$
          readOnly: true
        note:
          type: string
        status:
          allOf:
          - $ref: '#/components/schemas/AbsenceStatusEnum'
          readOnly: true
        status_label:
          type: string
          readOnly: true
        decision_note:
          type: string
          readOnly: true
        reviewed_by:
          type: integer
          readOnly: true
          nullable: true
        reviewed_by_name:
          type: string
          nullable: true
          readOnly: true
        reviewed_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        version:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - decision_note
      - employee
      - employee_name
      - end_date
      - id
      - kind
      - kind_label
      - reviewed_at
      - reviewed_by
      - reviewed_by_name
      - start_date
      - status
      - status_label
      - updated_at
      - version
      - working_days
    AbsenceRequestAuditEvent:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        action:
          $ref: '#/components/schemas/AbsenceActionEnum'
        version:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        changes: {}
        actor:
          type: string
          nullable: true
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - action
      - actor
      - created_at
      - id
      - version
    AbsenceReview:
      type: object
      properties:
        decision:
          $ref: '#/components/schemas/DecisionEnum'
        decision_note:
          type: string
          maxLength: 2000
      required:
      - decision
    AbsenceStatusEnum:
      enum:
      - requested
      - approved
      - rejected
      - cancelled
      type: string
      description: |-
        * `requested` - Beantragt
        * `approved` - Genehmigt
        * `rejected` - Abgelehnt
        * `cancelled` - Storniert
    Action320Enum:
      enum:
      - created
      - updated
      - archived
      - billed
      type: string
      description: |-
        * `created` - Erstellt
        * `updated` - Geändert
        * `archived` - Archiviert
        * `billed` - Abgerechnet
    Address:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        kind:
          $ref: '#/components/schemas/AddressKindEnum'
        label:
          type: string
          maxLength: 100
        street:
          type: string
          maxLength: 200
        postal_code:
          type: string
          maxLength: 20
        city:
          type: string
          maxLength: 120
        country_code:
          type: string
          default: DE
          pattern: ^[A-Za-z]{2}$
