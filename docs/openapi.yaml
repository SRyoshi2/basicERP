          maximum: 9223372036854775807
          minimum: 0
          format: int64
        changes: {}
        actor:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - action
      - actor
      - created_at
      - id
      - version
