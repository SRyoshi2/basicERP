openapi: 3.0.3
info:
  title: basicERP API
  version: 0.1.0
  description: API-first ERP für kleine Unternehmen
paths:
  /api/v1/archive/incoming-invoices/:
    get:
      operationId: archive_incoming_invoices_list
      parameters:
      - in: query
        name: format
        schema:
          type: string
          enum:
          - standard_pdf
          - unknown
          - xrechnung_cii
          - xrechnung_ubl
          - zugferd
      - name: page
        required: false
        in: query
        description: Eine Seitenzahl in der paginierten Ergebnismenge.
        schema:
          type: integer
      - in: query
        name: search
        schema:
          type: string
        description: Nummer, Datei, Verkäufer oder Käufer
      - in: query
        name: status
        schema:
          type: string
          enum:
          - invalid
          - valid
      tags:
      - archive
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedIncomingInvoiceList'
          description: ''
    post:
      operationId: archive_incoming_invoices_create
      tags:
      - archive
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/IncomingInvoiceUpload'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/IncomingInvoiceUpload'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncomingInvoice'
          description: ''
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncomingInvoice'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
          description: ''
  /api/v1/archive/incoming-invoices/{id}/:
    get:
      operationId: archive_incoming_invoices_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: Ein UUID-String, der incoming invoice identifiziert.
